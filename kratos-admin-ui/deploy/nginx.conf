map $host $kratos_admin_url {
  default "$KRATOS_ADMIN_URL";
}

map $host $kratos_public_url {
  default "$KRATOS_PUBLIC_URL";
}

# Expires map
map $sent_http_content_type $expires {
  default                    off;
  text/html                  epoch;
  text/css                   max;
  application/javascript     max;
  ~image/                    max;
  ~font/                     max;
}

server {
    listen 8080;

    # Admin API proxy - matches requests like /api/admin/* or /subpath/api/admin/*
    location ~ ^${BASE_PATH}/api/admin/(.*)$ {
        resolver 				 $NAMESERVER valid=30s;

        rewrite ^${BASE_PATH}/api/admin/(.*)$ /admin/$1  break;

        proxy_pass 				      $kratos_admin_url;
        proxy_redirect          off;
        proxy_set_header        Host            $host;
        proxy_set_header        X-Real-IP       $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Public API proxy - matches requests like /api/public/* or /subpath/api/public/*
    location ~ ^${BASE_PATH}/api/public/(.*)$ {
        resolver 				 $NAMESERVER valid=30s;

        rewrite ^${BASE_PATH}/api/public/(.*)$ /$1  break;

        proxy_pass 				      $kratos_public_url;
        proxy_redirect          off;
        proxy_set_header        Host            $host;
        proxy_set_header        X-Real-IP       $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static files - matches / or /subpath/*
    location ~ ^${BASE_PATH}(/.*)?$ {
        root /usr/share/nginx/html;
        try_files $1 $1/ /index.html =404;
    }
    
    expires $expires;
}